name: CI / Lint & Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    env:
      # Mock environment variables required for Next.js build-time analysis
      NODE_ENV: production
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_ghef
      AUTH_SECRET: ci_temporary_auth_secret_minimum_32_characters_for_nextauth
      NEXTAUTH_SECRET: ci_temporary_auth_secret_minimum_32_characters_for_nextauth
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci_dummy_cloud
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_dummy_key_123456
      RAZORPAY_KEY_SECRET: ci_dummy_secret_123456
      RAZORPAY_WEBHOOK_SECRET: ci_dummy_webhook_secret_123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code linting
        run: npm run lint

      - name: Run test suite
        run: npm run test
        continue-on-error: true

      - name: Build Next.js application
        run: npm run build
