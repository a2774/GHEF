name: CI / Lint & Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_ghef
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_ghef
      DATABASE_URL_UNPOOLED: postgresql://ci_user:ci_password@localhost:5432/ci_ghef
      AUTH_SECRET: ci_temporary_auth_secret_minimum_32_characters_for_nextauth
      NEXTAUTH_SECRET: ci_temporary_auth_secret_minimum_32_characters_for_nextauth
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci_dummy_cloud
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_dummy_key_123456
      RAZORPAY_KEY_SECRET: ci_dummy_secret_123456
      RAZORPAY_WEBHOOK_SECRET: ci_dummy_webhook_secret_123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check code linting
        run: npm run lint

      - name: Run database migrations
        run: npm run db:migrate
        continue-on-error: true

      - name: Run unit test suite
        run: npm run test
        continue-on-error: true

      - name: Build Next.js application
        env:
          NODE_ENV: production
        run: npm run build
